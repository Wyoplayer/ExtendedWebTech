<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.2.2/dist/aframe-physics-system.min.js"></script>
</head>

<body>

<a-scene physics="driver: cannon; debug: true">

  <!-- FLOOR -->
  <a-plane rotation="-90 0 0" width="20" height="20" static-body color="#444"></a-plane>

  <!-- BOX WITH DYNAMIC BODY -->
  <a-box id="testBox"
    position="0 5 0"
    color="red"
    dynamic-body>
  </a-box>

</a-scene>

</body>
</html>
